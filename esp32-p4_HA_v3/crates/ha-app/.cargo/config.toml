[build]
target = "riscv32imafc-esp-espidf"
# Windows: esp-idf-sys не переносит длинные пути; репозиторий лежит глубоко.
# Выносим target в короткий путь (официальный обход из шаблона esp-rs).
target-dir = "C:/t/hav3"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32p4"
ESP_IDF_VERSION = "v6.1"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
IDF_PATH = { value = "C:/Users/ASUS/.espressif/esp-idf/v6.1", force = true }
IDF_TOOLS_PATH = { value = "C:/Users/ASUS/.espressif", force = true }
IDF_PYTHON_ENV_PATH = { value = "C:/Users/ASUS/.espressif/python_env/idf6.1_py3.10_env", force = true }

# Обязательно при вынесенном target-dir (ограничение embuild, см. шаблон esp-rs).
CARGO_WORKSPACE_DIR = { value = "", relative = true }
