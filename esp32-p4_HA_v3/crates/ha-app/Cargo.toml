[package]
name = "ha-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ha-app"
harness = false

[profile.dev]
debug = true
opt-level = "z"

[profile.release]
opt-level = "s"

[dependencies]
log = "0.4"
ha-domain = { path = "../ha-domain" }
ha-automation = { path = "../ha-automation" }
micro-db = { path = "../micro-db" }
ha-web = { path = "../ha-web" }
zigbee-devices = { path = "../zigbee-devices" }
z2m-rs = { path = "../z2m-rs" }
zigbee-exec = { path = "../zigbee-exec" }
zigbee-frames = { path = "../zigbee-frames" }
esp-idf-svc = { version = "0.53", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

[build-dependencies]
embuild = "0.33.5"

# C-мост к esp-zigbee-lib (бывший PoC-крейт zigbee-esp).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["native_zigbee"]
remote_component = { name = "espressif/esp-zigbee-lib", version = ">=2.0.0" }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["native_net"]
remote_component = { name = "espressif/esp_hosted", version = "*" }
