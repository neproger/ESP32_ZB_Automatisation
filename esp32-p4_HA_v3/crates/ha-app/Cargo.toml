[package]
name = "ha-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ha-app"
harness = false

[features]
p4-lock-metrics = ["ha-domain/p4-lock-metrics", "ha-platform/p4-lock-metrics"]

[profile.dev]
debug = true
opt-level = "z"

[profile.release]
opt-level = "s"

[dependencies]
log = "0.4"
ha-domain = { path = "../ha-domain" }
ha-config = { path = "../ha-config" }
ha-automation = { path = "../ha-automation" }
ha-wifi = { path = "../ha-wifi" }
ha-system = { path = "../ha-system" }
ha-schema = { path = "../ha-schema" }
ha-platform = { path = "../ha-platform" }
ha-web-service = { path = "../ha-web-service" }
ha-web-actions = { path = "../ha-web-actions" }
ha-display = { path = "../ha-display" }
ha-zigbee-service = { path = "../ha-zigbee-service" }
esp-idf-svc = { version = "0.53", features = ["alloc", "critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

[build-dependencies]
embuild = "0.33.5"

# C-мост к esp-zigbee-lib (бывший PoC-крейт zigbee-esp).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["native_zigbee"]
remote_component = { name = "espressif/esp-zigbee-lib", version = ">=2.0.0" }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["native_net"]
remote_component = { name = "espressif/esp_hosted", version = "*" }

# Display: драйвер/настройки панели в C, LVGL-UI — из Rust.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["native_display"]
remote_component = { name = "lvgl/lvgl", version = ">=9.2,<10" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lvgl_port", version = "^2" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_touch_gt911", version = "^1" }

